<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Postly — Feed</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #faf8f4;
      --white: #ffffff;
      --accent: #e8533a;
      --accent-hover: #cf3e28;
      --border: #e0dcd5;
      --text: #222;
      --muted: #888;
      --radius: 10px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Navbar */
    nav {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--accent);
      text-decoration: none;
    }

    .nav-right { display: flex; align-items: center; gap: 12px; }

    .btn {
      padding: 8px 18px;
      font-size: 0.85rem;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      border-radius: var(--radius);
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

    /* Layout */
    .layout {
      max-width: 700px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    /* Search bar */
    .search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 28px;
    }

    .search-bar input {
      flex: 1;
      padding: 10px 16px;
      font-size: 0.9rem;
      font-family: 'DM Sans', sans-serif;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--white);
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar input:focus { border-color: var(--accent); }

    /* Post Card */
    .post-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 16px;
      transition: box-shadow 0.2s;
    }

    .post-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.07); }

    .post-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .post-author {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .post-author span {
      font-weight: 500;
      color: var(--accent);
    }

    .post-date { font-size: 0.75rem; color: var(--muted); }

    .post-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .post-content {
      font-size: 0.9rem;
      color: #555;
      line-height: 1.7;
      margin-bottom: 16px;
    }

    .post-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .vote-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.2s;
    }

    .vote-btn:hover, .vote-btn.voted {
      background: #fdecea;
      border-color: var(--accent);
      color: var(--accent);
    }

    .post-actions { display: flex; gap: 8px; }

    .btn-sm {
      padding: 6px 14px;
      font-size: 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid var(--border);
      font-family: 'DM Sans', sans-serif;
      background: transparent;
      color: var(--muted);
      transition: all 0.2s;
    }

    .btn-sm:hover { border-color: var(--accent); color: var(--accent); }

    .btn-sm.danger:hover { border-color: #e74c3c; color: #e74c3c; }

    /* Unpublished badge */
    .badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: #fff3cd;
      color: #856404;
      margin-left: 8px;
    }

    /* Empty / Loading */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    #errorBanner {
      background: #fdecea;
      color: #c0392b;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: none;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav>
  <a class="nav-logo" href="index.html">Postly</a>
  <div class="nav-right">
    <span id="userEmail" style="font-size:0.82rem; color:#888;"></span>
    <button class="btn btn-primary" onclick="window.location.href='create-post.html'">+ New Post</button>
    <button class="btn btn-outline" onclick="logout()">Logout</button>
  </div>
</nav>

<!-- Feed -->
<div class="layout">

  <!-- Search -->
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search posts..." oninput="handleSearch()"/>
  </div>

  <div id="errorBanner"></div>
  <div id="postList"><div class="loading">Loading posts...</div></div>

</div>

<script>
  const API = 'http://localhost:8000';
  let token = localStorage.getItem('token');
  let currentUserId = null;
  let searchTimer = null;

  // Redirect if not logged in
  if (!token) window.location.href = 'login.html';

  // Decode JWT to get user id (simple base64 decode, no library needed)
  function getUserIdFromToken(t) {
    try {
      const payload = JSON.parse(atob(t.split('.')[1]));
      return payload.user_id;
    } catch { return null; }
  }

  currentUserId = getUserIdFromToken(token);

  // Auth headers
  function authHeaders() {
    return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
  }

  // Load posts
  async function loadPosts(search = '') {
    try {
      const url = API + '/posts/?limit=20&skip=0&search=' + encodeURIComponent(search);
      const res = await fetch(url, { headers: authHeaders() });

      if (res.status === 401) { logout(); return; }

      const posts = await res.json();
      renderPosts(posts);
    } catch (err) {
      showError('Cannot connect to backend. Make sure the server is running.');
    }
  }

  function renderPosts(posts) {
    const list = document.getElementById('postList');

    if (!posts || posts.length === 0) {
      list.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><p>No posts yet. Be the first to post!</p></div>';
      return;
    }

    let html = '';
    for (let i = 0; i < posts.length; i++) {
      const item = posts[i];
      const post  = item.Post;
      const votes = item.votes;

      const date = new Date(post.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      const isOwner = post.user_id === currentUserId;
      const unpublished = !post.published ? '<span class="badge">Draft</span>' : '';

      html += '<div class="post-card" id="post-' + post.id + '">';

      // Meta
      html += '<div class="post-meta">';
      html += '  <div class="post-author">by <span>' + post.owner.email + '</span>' + unpublished + '</div>';
      html += '  <div class="post-date">' + date + '</div>';
      html += '</div>';

      // Content
      html += '<div class="post-title">' + escHtml(post.title) + '</div>';
      html += '<div class="post-content">' + escHtml(post.content) + '</div>';

      // Footer
      html += '<div class="post-footer">';
      html += '  <button class="vote-btn" onclick="vote(' + post.id + ', this)">♥ <span>' + votes + '</span></button>';
      html += '  <div class="post-actions">';
      if (isOwner) {
        html += '    <button class="btn-sm" onclick="editPost(' + post.id + ')">Edit</button>';
        html += '    <button class="btn-sm danger" onclick="deletePost(' + post.id + ')">Delete</button>';
      }
      html += '  </div>';
      html += '</div>';

      html += '</div>';
    }

    list.innerHTML = html;
  }

  // Vote on a post
  async function vote(postId, btn) {
    const countEl = btn.querySelector('span');
    const currentVotes = parseInt(countEl.textContent);
    const isVoted = btn.classList.contains('voted');

    // Optimistic UI update
    btn.classList.toggle('voted');
    countEl.textContent = isVoted ? currentVotes - 1 : currentVotes + 1;

    try {
      const res = await fetch(API + '/vote/', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ post_id: postId, dir: isVoted ? 0 : 1 })
      });

      if (!res.ok) {
        // Revert if failed
        btn.classList.toggle('voted');
        countEl.textContent = currentVotes;
      }
    } catch {
      btn.classList.toggle('voted');
      countEl.textContent = currentVotes;
    }
  }

  // Delete a post
  async function deletePost(postId) {
    if (!confirm('Delete this post?')) return;

    const res = await fetch(API + '/posts/' + postId, {
      method: 'DELETE',
      headers: authHeaders()
    });

    if (res.ok || res.status === 204) {
      document.getElementById('post-' + postId).remove();
    } else {
      alert('Could not delete post.');
    }
  }

  // Go to edit page
  function editPost(postId) {
    window.location.href = 'create-post.html?edit=' + postId;
  }

  // Search with debounce
  function handleSearch() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      loadPosts(document.getElementById('searchInput').value.trim());
    }, 400);
  }

  function showError(msg) {
    const el = document.getElementById('errorBanner');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function logout() {
    localStorage.removeItem('token');
    window.location.href = 'login.html';
  }

  // Show user email in navbar
  async function loadUserEmail() {
    if (!currentUserId) return;
    try {
      const res = await fetch(API + '/users/' + currentUserId, { headers: authHeaders() });
      if (res.ok) {
        const user = await res.json();
        document.getElementById('userEmail').textContent = user.email;
      }
    } catch {}
  }

  loadUserEmail();
  loadPosts();
</script>
</body>
</html>
