<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Postly — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #faf8f4;
      --white: #ffffff;
      --black: #111;
      --accent: #e8533a;
      --accent-hover: #cf3e28;
      --border: #e0dcd5;
      --text: #222;
      --muted: #888;
      --radius: 10px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 900;
      color: var(--accent);
      text-align: center;
      margin-bottom: 6px;
    }

    .tagline {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 32px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 28px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      background: var(--bg);
      color: var(--muted);
      border: none;
      transition: all 0.2s;
    }

    .tab.active {
      background: var(--accent);
      color: white;
    }

    /* Form */
    .form { display: none; }
    .form.active { display: block; }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 11px 14px;
      font-size: 0.9rem;
      font-family: 'DM Sans', sans-serif;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text);
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }

    input:focus { border-color: var(--accent); }

    .btn {
      width: 100%;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .error-msg {
      background: #fdecea;
      color: #c0392b;
      font-size: 0.82rem;
      padding: 10px 14px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      display: none;
    }

    .success-msg {
      background: #eafaf1;
      color: #1e8449;
      font-size: 0.82rem;
      padding: 10px 14px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">Postly</div>
  <div class="tagline">Share your thoughts with the world</div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('login')">Login</button>
    <button class="tab" onclick="showTab('signup')">Sign Up</button>
  </div>

  <!-- Login Form -->
  <div class="form active" id="loginForm">
    <div class="error-msg" id="loginError"></div>
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="you@example.com"/>
    <label>Password</label>
    <input type="password" id="loginPassword" placeholder="Your password"/>
    <button class="btn" onclick="login()">Login</button>
  </div>

  <!-- Signup Form -->
  <div class="form" id="signupForm">
    <div class="error-msg" id="signupError"></div>
    <div class="success-msg" id="signupSuccess">Account created! You can now log in.</div>
    <label>Email</label>
    <input type="email" id="signupEmail" placeholder="you@example.com"/>
    <label>Password</label>
    <input type="password" id="signupPassword" placeholder="Choose a password"/>
    <button class="btn" onclick="signup()">Create Account</button>
  </div>
</div>

<script>
  const API = 'http://localhost:8000';

  function showTab(tab) {
    document.getElementById('loginForm').classList.toggle('active', tab === 'login');
    document.getElementById('signupForm').classList.toggle('active', tab === 'signup');
    document.querySelectorAll('.tab').forEach((t, i) => {
      t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'signup'));
    });
  }

  async function login() {
    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errEl    = document.getElementById('loginError');
    errEl.style.display = 'none';

    if (!email || !password) {
      errEl.textContent = 'Please fill in all fields.';
      errEl.style.display = 'block';
      return;
    }

    // FastAPI OAuth2 expects form data, not JSON
    const formData = new URLSearchParams();
    formData.append('username', email);
    formData.append('password', password);

    try {
      const res = await fetch(API + '/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: formData
      });

      const data = await res.json();

      if (!res.ok) {
        errEl.textContent = data.detail || 'Login failed.';
        errEl.style.display = 'block';
        return;
      }

      // Save token and go to feed
      localStorage.setItem('token', data.access_token);
      window.location.href = 'index.html';

    } catch (err) {
      errEl.textContent = 'Cannot connect to server.';
      errEl.style.display = 'block';
    }
  }

  async function signup() {
    const email    = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    const errEl    = document.getElementById('signupError');
    const okEl     = document.getElementById('signupSuccess');
    errEl.style.display = 'none';
    okEl.style.display  = 'none';

    if (!email || !password) {
      errEl.textContent = 'Please fill in all fields.';
      errEl.style.display = 'block';
      return;
    }

    try {
      const res = await fetch(API + '/users/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (!res.ok) {
        errEl.textContent = data.detail || 'Signup failed.';
        errEl.style.display = 'block';
        return;
      }

      okEl.style.display = 'block';
      setTimeout(() => showTab('login'), 1500);

    } catch (err) {
      errEl.textContent = 'Cannot connect to server.';
      errEl.style.display = 'block';
    }
  }

  // If already logged in, redirect to feed
  if (localStorage.getItem('token')) {
    window.location.href = 'index.html';
  }

  // Enter key support
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      const loginActive = document.getElementById('loginForm').classList.contains('active');
      if (loginActive) login(); else signup();
    }
  });
</script>
</body>
</html>
