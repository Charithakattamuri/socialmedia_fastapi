<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Postly — Write</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #faf8f4;
      --white: #ffffff;
      --accent: #e8533a;
      --accent-hover: #cf3e28;
      --border: #e0dcd5;
      --text: #222;
      --muted: #888;
      --radius: 10px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    nav {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--accent);
      text-decoration: none;
      cursor: pointer;
    }

    .btn {
      padding: 8px 18px;
      font-size: 0.85rem;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      border-radius: var(--radius);
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

    .layout {
      max-width: 680px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 28px;
      color: var(--text);
    }

    .form-group { margin-bottom: 20px; }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 7px;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-family: 'DM Sans', sans-serif;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--white);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    textarea:focus { border-color: var(--accent); }

    textarea {
      height: 220px;
      resize: vertical;
      line-height: 1.7;
    }

    /* Published toggle */
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
    }

    .toggle input { display: none; }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: #ddd;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      background: white;
      border-radius: 50%;
      top: 3px;
      left: 3px;
      transition: transform 0.2s;
    }

    .toggle input:checked + .toggle-slider { background: var(--accent); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(20px); }

    .toggle-label { font-size: 0.88rem; color: var(--muted); }

    /* Buttons row */
    .form-actions { display: flex; gap: 12px; }

    /* Error */
    .error-msg {
      background: #fdecea;
      color: #c0392b;
      font-size: 0.82rem;
      padding: 10px 14px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo" onclick="window.location.href='index.html'">Postly</div>
  <button class="btn btn-outline" onclick="window.location.href='index.html'">← Back to Feed</button>
</nav>

<div class="layout">
  <h2 id="pageTitle">Write a Post</h2>

  <div class="error-msg" id="errorMsg"></div>

  <div class="form-group">
    <label>Title</label>
    <input type="text" id="titleInput" placeholder="Give your post a title..."/>
  </div>

  <div class="form-group">
    <label>Content</label>
    <textarea id="contentInput" placeholder="What's on your mind?"></textarea>
  </div>

  <div class="toggle-row">
    <label class="toggle">
      <input type="checkbox" id="publishedToggle" checked/>
      <span class="toggle-slider"></span>
    </label>
    <span class="toggle-label">Publish immediately</span>
  </div>

  <div class="form-actions">
    <button class="btn btn-primary" id="submitBtn" onclick="submitPost()">Publish Post</button>
    <button class="btn btn-outline" onclick="window.location.href='index.html'">Cancel</button>
  </div>
</div>

<script>
  const API = 'http://localhost:8000';
  const token = localStorage.getItem('token');

  if (!token) window.location.href = 'login.html';

  // Check if we're editing
  const params = new URLSearchParams(window.location.search);
  const editId = params.get('edit');

  function authHeaders() {
    return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
  }

  // If editing, load existing post
  if (editId) {
    document.getElementById('pageTitle').textContent = 'Edit Post';
    document.getElementById('submitBtn').textContent = 'Save Changes';

    fetch(API + '/posts/' + editId, { headers: authHeaders() })
      .then(res => res.json())
      .then(data => {
        const post = data.Post;
        document.getElementById('titleInput').value   = post.title;
        document.getElementById('contentInput').value = post.content;
        document.getElementById('publishedToggle').checked = post.published;
      })
      .catch(() => {
        showError('Could not load post.');
      });
  }

  async function submitPost() {
    const title     = document.getElementById('titleInput').value.trim();
    const content   = document.getElementById('contentInput').value.trim();
    const published = document.getElementById('publishedToggle').checked;
    const btn       = document.getElementById('submitBtn');
    const errEl     = document.getElementById('errorMsg');
    errEl.style.display = 'none';

    if (!title || !content) {
      showError('Please fill in both title and content.');
      return;
    }

    btn.disabled = true;
    btn.textContent = editId ? 'Saving...' : 'Publishing...';

    const body = JSON.stringify({ title, content, published });

    try {
      let res;
      if (editId) {
        res = await fetch(API + '/posts/' + editId, {
          method: 'PUT',
          headers: authHeaders(),
          body
        });
      } else {
        res = await fetch(API + '/posts/', {
          method: 'POST',
          headers: authHeaders(),
          body
        });
      }

      if (res.ok || res.status === 201) {
        window.location.href = 'index.html';
      } else {
        const data = await res.json();
        showError(data.detail || 'Something went wrong.');
        btn.disabled = false;
        btn.textContent = editId ? 'Save Changes' : 'Publish Post';
      }
    } catch (err) {
      showError('Cannot connect to server.');
      btn.disabled = false;
      btn.textContent = editId ? 'Save Changes' : 'Publish Post';
    }
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  // Ctrl+Enter to submit
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') submitPost();
  });
</script>
</body>
</html>
